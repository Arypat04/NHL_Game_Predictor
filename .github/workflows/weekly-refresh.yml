name: Weekly data refresh

# Free scheduled runner for the data refresh (replaces a paid Render cron).
# Refreshes the current season + MLB pitcher starts into MongoDB.
on:
  schedule:
    - cron: "0 9 * * 1"      # Mondays 09:00 UTC
  workflow_dispatch:          # manual trigger — use this to backfill on demand

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run weekly refresh
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python weekly_refresh.py
