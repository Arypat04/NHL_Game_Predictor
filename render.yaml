services:

  # ── Backend ──────────────────────────────────────────────────────────
  - type: web
    name: nhl-predictor-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # No persistent disk: the free tier doesn't support one, so the filesystem is
    # ephemeral and every spin-down loses the trained models. Instead they're
    # cached in MongoDB (base_database.save_model/load_model) and restored on
    # cold start in a couple of seconds rather than retrained.
    envVars:
      - key: ODDS_API_KEY
        sync: false          # set manually in Render dashboard
      - key: MONGODB_URI
        sync: false          # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # set after frontend deploys

  # ── Frontend ─────────────────────────────────────────────────────────
  # Note: the weekly data refresh runs for free on GitHub Actions
  # (.github/workflows/weekly-refresh.yml), not as a Render cron.
  - type: web
    name: nhl-predictor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to backend URL after backend deploys