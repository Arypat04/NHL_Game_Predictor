<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0a0e16"/>
  <!-- probability axis -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#2a3344" stroke-width="2" stroke-linecap="round"/>
  <!-- edge caliper (signal) -->
  <line x1="16" y1="16" x2="22" y2="16" stroke="#37d2c6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- market ring -->
  <circle cx="16" cy="16" r="2.4" fill="#0a0e16" stroke="#8090a8" stroke-width="1.6"/>
  <!-- model needle -->
  <path d="M22 7.5 L22 16" stroke="#37d2c6" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 7.5 l-2.6 3.2 h5.2 Z" fill="#37d2c6"/>
</svg>
